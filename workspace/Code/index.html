<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Traffic Light Demonstration</h1>
        <div class="traffic-light">
            <div class="light" id="red-light"></div>
            <div class="light" id="yellow-light"></div>
            <div class="light" id="green-light"></div>
        </div>
        <div class="controls">
            <button id="red-btn" class="btn red-btn">Red</button>
            <button id="yellow-btn" class="btn yellow-btn">Yellow</button>
            <button id="green-btn" class="btn green-btn">Green</button>
        </div>
        <!-- @req_id: REQ-2-01 Timer Configuration and Controls -->
        <div class="timer-controls">
            <div class="input-group">
                <label for="timer-interval-input">Interval (seconds):</label>
                <input 
                    type="number" 
                    id="timer-interval-input" 
                    name="timer-interval" 
                    min="1" 
                    step="1" 
                    value="3" 
                    placeholder="3"
                />
                <span id="timer-error-msg" class="error-msg" aria-live="polite"></span>
            </div>
            <button id="timer-toggle-btn" class="btn timer-btn">Start Timer</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
